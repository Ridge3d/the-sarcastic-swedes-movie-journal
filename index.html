<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Sarcastic Swede's Movie Journal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: Arial, sans-serif; }

    .app-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(110px, 22vh) 1fr;
      background: #0e0e0f;
    }

    .brand-masthead {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #38383f;
      background: #050505;
      box-shadow: 0 12px 32px rgba(0,0,0,.5);
    }

    .brand-masthead img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 28%;
    }

    .brand-masthead::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,.12), transparent 45%, rgba(0,0,0,.18));
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0e0e0f;
      opacity: 1;
      transition: opacity .55s ease;
    }

    body.intro-active .app-shell { opacity: 0; }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition: opacity .65s ease, visibility .65s ease;
    }

    .intro-screen.intro-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .intro-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #e53935;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      transition: opacity .25s ease;
    }

    .intro-loading.ready { opacity: 0; }

    .skip-intro {
      position: absolute;
      right: 24px;
      bottom: 24px;
      padding: 11px 18px;
      border: 1px solid #e53935;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font: 700 16px Arial, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .skip-intro:hover { background: #c62828; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .app-shell { grid-template-rows: 105px 1fr; }
      .brand-masthead img { object-position: center top; }
      .skip-intro { right: 16px; bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-screen, .app-shell { transition: none; }
      .intro-loading { animation: none; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="brand-masthead">
      <img src="assets/movie-journal-brand.png" alt="The Sarcastic Swede's Movie Journal">
    </header>

    <iframe
      id="appFrame"
      title="The Sarcastic Swede's Movie Journal"
      src="The-Sarcastic-Swedes-Movie-Journal-v1.4.html"
    ></iframe>
  </main>

  <div id="introScreen" class="intro-screen" aria-label="Movie Journal introduction">
    <video id="introVideo" class="intro-video" autoplay muted playsinline preload="auto">
      <source src="assets/movie-journal-intro.mp4" type="video/mp4">
    </video>
    <div id="introLoading" class="intro-loading" aria-hidden="true"></div>
    <button id="skipIntro" class="skip-intro" type="button">Skip Intro</button>
  </div>

  <script>
    (() => {
      const sessionKey = "sarcasticSwedeIntroPlayed";
      const introScreen = document.getElementById("introScreen");
      const introVideo = document.getElementById("introVideo");
      const skipIntro = document.getElementById("skipIntro");
      const introLoading = document.getElementById("introLoading");

      const finishIntro = () => {
        if (!introScreen || introScreen.classList.contains("intro-hidden")) return;

        try { sessionStorage.setItem(sessionKey, "true"); } catch {}

        introScreen.classList.add("intro-hidden");
        document.body.classList.remove("intro-active");

        window.setTimeout(() => {
          introVideo.pause();
          introScreen.remove();
        }, 700);
      };

      let alreadyPlayed = false;
      try { alreadyPlayed = sessionStorage.getItem(sessionKey) === "true"; } catch {}

      if (alreadyPlayed || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        introScreen.remove();
        return;
      }

      document.body.classList.add("intro-active");
      introVideo.addEventListener("canplay", () => introLoading.classList.add("ready"));
      introVideo.addEventListener("playing", () => introLoading.classList.add("ready"));
      introVideo.addEventListener("ended", finishIntro);
      introVideo.addEventListener("error", finishIntro);
      skipIntro.addEventListener("click", finishIntro);

      const attempt = introVideo.play();
      if (attempt && typeof attempt.catch === "function") {
        attempt.catch(() => introLoading.classList.add("ready"));
      }

      window.setTimeout(() => {
        if (introVideo.readyState < 2) finishIntro();
      }, 12000);
    })();
  </script>
</body>
</html>
