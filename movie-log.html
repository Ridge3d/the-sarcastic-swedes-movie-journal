<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Swede's Movie Log</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui,sans-serif}main{max-width:800px;margin:auto;padding:22px}h1{color:#e13b3b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #333}th{color:#bbb}#status{color:#aaa}</style></head><body><main><h1>The Swede's Movie Log</h1><p id="status">Loading watched movies…</p><table><thead><tr><th>Movie</th><th>Year</th><th>Date watched</th></tr></thead><tbody id="movies"></tbody></table></main><script>(async()=>{const status=document.getElementById('status');try{const response=await fetch('/api/public-movies',{cache:'no-store'});if(!response.ok)throw Error('Sync is not connected yet');const data=await response.json();const movies=Array.isArray(data)?data:data.movies;if(!Array.isArray(movies))throw Error('Invalid movie list');movies.sort((a,b)=>String(b.watched_date||'').localeCompare(String(a.watched_date||'')));const tbody=document.getElementById('movies');for(const movie of movies){const tr=document.createElement('tr');for(const value of [movie.title,movie.year,movie.watched_date]){const td=document.createElement('td');td.textContent=value==null?'':String(value);tr.append(td)}tbody.append(tr)}status.textContent=movies.length+' movies watched';}catch(e){status.textContent='The movie list is not connected yet.'}})();</script></body></html>
